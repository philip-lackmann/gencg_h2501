<!DOCTYPE html>

<head>
  <title>embedded example</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
  </style>
  <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
</head>

<body>
<script src="handtracker.js"></script>
<script src="drawingmachine.js"></script>
<a-scene>
  <a-entity camera look-controls position="0 0 0"></a-entity>
  <a-sky color="#0f0f0f"></a-sky>

  <a-entity id="leftHand" hand-tracking-controls="hand: left;"></a-entity>
  <a-entity id="rightHand" hand-tracking-controls="hand: right;"></a-entity>

  <a-entity id="handTracker" hand-params="handedness: right;"></a-entity>
  <a-entity id="drawingMachine"
            geometry="primitive: sphere; radius: 5"
            position="0 0 -10"
            material="
                    side: double;
                    shader:
                        my-shader;
                        thickness: 0.5;
                        colorMix: 0.5;
                        displacementAmp: 0.2;
                        noiseScale: 6.0"
            drawing-machine>
  </a-entity>
</a-scene>
</body>
</html>
